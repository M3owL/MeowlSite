<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3owL - Polish Translator Portfolio</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { dark: '#0f172a', darker: '#020617', accent: '#06b6d4' },
                    animation: { 
                        'scroll': 'scroll 30s linear infinite',
                        'fade-in': 'fadeIn 0.25s ease-out forwards'
                    },
                    keyframes: {
                        scroll: { '0%': { transform: 'translateX(0)' }, '100%': { transform: 'translateX(-50%)' } },
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(6px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }

                }
            }
        }

    <style>
        body { background-color:#020617;color:#f8fafc;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;overflow-x:hidden }
        .glass { background:rgba(30,41,59,.75);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1) }
        .hide-scrollbar::-webkit-scrollbar { display:none }
        .hide-scrollbar { -ms-overflow-style:none;scrollbar-width:none }
        .marquee-container { display:flex;width:max-content }
        .marquee-container:hover { animation-play-state:paused }
        .form-input { width:100%;background:#111827;border:1px solid #374151;border-radius:.375rem;padding:.55rem .65rem;color:#fff }
        .form-input:focus { border-color:#06b6d4;outline:none }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const SUPABASE_URL = 'https://empvklffqwrlllovhgzx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_an1FqOGAgwRQCzxp6UWuvQ_TFadZ9EW';

let supabaseClient = null;

const REMEMBER_KEY = 'm3owl_remember_session';
if (localStorage.getItem(REMEMBER_KEY) === null) localStorage.setItem(REMEMBER_KEY, 'true');

const authStorage = {
    getItem: (key) => {
        try {
            return localStorage.getItem(REMEMBER_KEY) === 'true' ? localStorage.getItem(key) : sessionStorage.getItem(key);
        } catch (e) { return null; }
    },
    setItem: (key, value) => {
        try {
            (localStorage.getItem(REMEMBER_KEY) === 'true' ? localStorage : sessionStorage).setItem(key, value);
        } catch (e) {}
    },
    removeItem: (key) => {
        try { localStorage.removeItem(key); sessionStorage.removeItem(key); } catch (e) {}
    }
};

function getSupabase() {
    if (supabaseClient) return supabaseClient;
    if (window.supabase && typeof window.supabase.createClient === 'function') {
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
                auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: authStorage }
            });
            return supabaseClient;
        } catch (e) {
            return null;
        }
    }
    return null;
}

const defaultCategories = [
    { category:'Speed', value:5 },
    { category:'Communication', value:5 },
    { category:'Professionalism', value:5 },
    { category:'Reliability', value:5 }
];

function renderStars(rating) {
    const value = Number(rating) || 0;
    const stars = [];
    for (let i=1;i<=5;i++) {
        if (i <= Math.floor(value)) {
            stars.push(<span key={i} className="text-yellow-400">★</span>);
        } else if (i === Math.ceil(value) && value % 1 !== 0) {
            const percentage = (value % 1) * 100;
            stars.push(
                <span key={i} className="relative inline-block text-gray-600">
                    ★
                    <span className="absolute top-0 left-0 overflow-hidden text-yellow-400" style={{width:`${percentage}%`}}>★</span>
                </span>
            );
        } else {
            stars.push(<span key={i} className="text-gray-600">★</span>);
        }
    }
    return <div className="flex gap-0.5 items-center">{stars}</div>;
}

function calculateAverageRating(ratings) {
    if (!Array.isArray(ratings) || ratings.length===0) return 0;
    const values = ratings.map(r=>Number(r.value)).filter(Number.isFinite);
    if (!values.length) return 0;
    return values.reduce((a,b)=>a+b,0)/values.length;
}

function formatDate(dateString) {
    if (!dateString) return '';
    return new Date(dateString).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
}

function getSteamAppId(url) {
    if (!url) return null;
    const match = url.match(/\/app\/(\d+)/);
    return match ? match[1] : null;
}

function avatarFallback(name) {
    return `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'User')}&background=0f172a&color=fff`;
}

function normalizeProject(p) {
    return {
        ...p,
        steamLink: p.steamLink != null ? p.steamLink : (p.steam_url != null ? p.steam_url : ''),
        bg_url: p.bg_url || '',
        logo_url: p.logo_url || '',
        details: p.details != null ? p.details : '',
        pinnedReviews: p.pinnedReviews != null ? p.pinnedReviews : (p.pinned_reviews != null ? p.pinned_reviews : []),
        pinned: !!p.pinned,
        sort_order: p.sort_order != null ? Number(p.sort_order) : 0,
        bg_offset_x: Number(p.bg_offset_x) || 0,
        bg_offset_y: Number(p.bg_offset_y) || 0,
        logo_offset_x: Number(p.logo_offset_x) || 0,
        logo_offset_y: Number(p.logo_offset_y) || 0
    };
}

function normalizeReview(r) {
    return {
        ...r,
        pfp: r.pfp != null ? r.pfp : (r.avatar_url != null ? r.avatar_url : ''),
        discord: r.discord != null ? r.discord : (r.discord_username != null ? r.discord_username : ''),
        text: r.text != null ? r.text : (r.review_text != null ? r.review_text : ''),
        date: r.date != null ? r.date : (r.created_at != null ? r.created_at : ''),
        game_title: r.game_title != null ? r.game_title : '',
        ratings: Array.isArray(r.ratings) ? r.ratings : []
    };
}

function normalizeCode(c) {
    return {
        ...c,
        pfp: c.pfp != null ? c.pfp : (c.avatar_url != null ? c.avatar_url : ''),
        discord: c.discord != null ? c.discord : (c.discord_username != null ? c.discord_username : ''),
        game_title: c.game_title != null ? c.game_title : '',
        used: !!c.used
    };
}

function App() {
    const [reviews,setReviews] = useState([]);
    const [projects,setProjects] = useState([]);
    const [inviteCodes,setInviteCodes] = useState([]);
    const [isAdmin,setIsAdmin] = useState(false);
    const [session,setSession] = useState(null);
    const [activeTab,setActiveTab] = useState('portfolio');
    const [loading,setLoading] = useState(true);
    const [error,setError] = useState('');
    const [toast,setToast] = useState('');

    const [modal, setModal] = useState({ type: null, data: null });

    const loadReviews = async (adminView=isAdmin) => {
        const client = getSupabase();
        if (!client) return;
        let query = client.from('reviews').select('*').order('created_at',{ascending:false});
        if (!adminView) query = query.eq('published',true);
        const {data,error} = await query;
        if (error) { handleNetworkError(error); return; }
        setReviews((data || []).map(normalizeReview));
    };

    const loadProjects = async () => {
        const client = getSupabase();
        if (!client) return;
        const {data,error} = await client.from('projects').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false});
        if (error) { handleNetworkError(error); return; }
        setProjects((data || []).map(normalizeProject));
    };

    const loadInviteCodes = async () => {
        const client = getSupabase();
        if (!client || !isAdmin) return;
        const {data,error} = await client.from('invite_codes').select('*').eq('used',false).order('created_at',{ascending:false});
        if (error) { handleNetworkError(error); return; }
        setInviteCodes((data || []).map(normalizeCode));
    };

    const handleNetworkError = (err) => {
        if (err && (err.message?.includes('Failed to fetch') || err.status === 0)) {
            setError('Privacy extension is blocking Supabase connection. Disable adblocker for this site.');
        } else if (err) {
            setError(err.message);
        }
    };

    const checkAdmin = async (currentSession) => {
        const client = getSupabase();
        if (!client || !currentSession || !currentSession.user) {
            setIsAdmin(false);
            return false;
        }
        const {data,error} = await client.from('admin_users').select('user_id').eq('user_id',currentSession.user.id).maybeSingle();
        const ok = !error && !!data;
        setIsAdmin(ok);
        return ok;
    };

    useEffect(() => {
        let attempts = 0;
        const checkLibrary = setInterval(async () => {
            attempts++;
            const client = getSupabase();

            if (client && client.auth) {
                clearInterval(checkLibrary);
                try {
                    const {data:{session:currentSession}} = await client.auth.getSession();
                    setSession(currentSession);
                    const admin = await checkAdmin(currentSession);
                    await Promise.all([loadReviews(admin), loadProjects()]);
                    if (admin) await loadInviteCodes();
                } catch (e) {
                    handleNetworkError(e);
                } finally {
                    setLoading(false);
                }

                client.channel('m3owl-live')
                    .on('postgres_changes',{event:'*',schema:'public',table:'reviews'},async () => {
                        const c = getSupabase();
                        if (c?.auth) {
                            const {data:{session:currentSession}} = await c.auth.getSession();
                            const admin = await checkAdmin(currentSession);
                            await loadReviews(admin);
                        }
                    })
                    .on('postgres_changes',{event:'*',schema:'public',table:'projects'},loadProjects)
                    .on('postgres_changes',{event:'*',schema:'public',table:'invite_codes'},loadInviteCodes)
                    .subscribe();

            } else if (attempts > 50) {
                clearInterval(checkLibrary);
                setError('Failed to load Supabase from CDN. Check your network.');
                setLoading(false);
            }
        }, 200);

        return () => clearInterval(checkLibrary);
    }, []);

    useEffect(() => {
        if (!toast) return;
        const t = setTimeout(()=>setToast(''),2500);
        return ()=>clearTimeout(t);
    },[toast]);

    const logout = async () => {
        const client = getSupabase();
        if (client) await client.auth.signOut();
        setSession(null);
        setIsAdmin(false);
        setInviteCodes([]);
        setActiveTab('reviews');
        setToast('Logged out.');
    };

    const handleLoginSuccess = async (newSession) => {
        const client = getSupabase();
        setSession(newSession);
        const admin = await checkAdmin(newSession);
        if (!admin) {
            if (client) await client.auth.signOut();
            setError('This account does not have admin privileges.');
            return;
        }
        await Promise.all([loadReviews(true),loadProjects(),loadInviteCodes()]);
        setModal({ type: null, data: null });
        setActiveTab('admin');
        setToast('Logged in successfully.');
    };

    const navTabs = [
        { id: 'about', label: 'About Me' },
        { id: 'portfolio', label: 'Game Translation History' },
        { id: 'reviews', label: 'Feedbacks' }
    ];

    return (
        <div className="min-h-screen flex flex-col relative">
            <header className="glass sticky top-0 z-40 py-3 px-8 grid grid-cols-1 lg:grid-cols-3 items-center border-b border-gray-800 gap-4">
                <div className="flex flex-col text-center lg:text-left">
                    <h1 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-accent to-blue-500">M3owL</h1>
                    <p className="text-xs text-gray-400 truncate">Jakub K. | Discord: <span className="text-white font-mono">_m3owl</span></p>
                </div>
                
                <nav className="flex flex-wrap justify-center gap-2 lg:gap-4">
                    {navTabs.map(tab => (
                        <button 
                            key={tab.id}
                            onClick={() => setActiveTab(tab.id)} 
                            className={`px-4 py-3 rounded-lg transition-all duration-300 font-bold border ${activeTab === tab.id ? 'bg-gray-800/80 border-gray-600 text-accent shadow-[0_0_15px_rgba(6,182,212,0.15)]' : 'border-transparent text-gray-400 hover:bg-gray-800/50 hover:text-white hover:border-gray-700'}`}
                        >
                            {tab.label}
                        </button>
                    ))}
                    {isAdmin && (
                        <button 
                            onClick={() => setActiveTab('admin')} 
                            className={`w-36 py-3 rounded-lg transition-all duration-300 font-bold border ${activeTab === 'admin' ? 'bg-gray-800/80 border-gray-600 text-accent shadow-[0_0_15px_rgba(6,182,212,0.15)]' : 'border-transparent text-gray-400 hover:bg-gray-800/50 hover:text-white hover:border-gray-700'}`}
                        >
                            Admin Panel
                        </button>
                    )}
                </nav>

                <div className="flex justify-center lg:justify-end">
                    {isAdmin && (
                        <button onClick={logout} className="bg-red-900/80 hover:bg-red-800 text-white px-6 py-2 rounded-lg border border-red-600 transition-colors font-bold text-sm">Logout</button>
                    )}
                </div>
            </header>

            <main className="flex-grow p-8 max-w-7xl mx-auto w-full relative">
                {error && <div className="mb-8 p-4 rounded-xl border border-red-500/50 bg-red-950/40 text-red-200 text-sm flex justify-between items-center"><span>⚠️ <b>Error:</b> {error}</span><button className="text-lg font-bold ml-4" onClick={()=>setError('')}>×</button></div>}
                {loading ? <div className="py-24 text-center text-gray-500 font-bold">Connecting to database...</div> : <>
                    {activeTab==='about' && <AboutMe />}
                    {activeTab==='portfolio' && <PortfolioTab projects={projects} reviews={reviews} isAdmin={isAdmin} onChanged={loadProjects} onError={setError} openProjectModal={(proj)=>setModal({type:'projectForm', data:proj})} />}
                    {activeTab==='reviews' && <ReviewsTab reviews={reviews} isAdmin={isAdmin} onRefresh={()=>loadReviews(isAdmin)} onError={setError} onToast={setToast} openCodeModal={()=>setModal({type:'inviteCode', data:null})} />}
                    {activeTab==='admin' && isAdmin && <AdminTab reviews={reviews} inviteCodes={inviteCodes} reloadReviews={loadReviews} reloadProjects={loadProjects} reloadCodes={loadInviteCodes} onError={setError} onToast={setToast} openReviewModal={(rev)=>setModal({type:'reviewForm', data:rev})} openGenerateModal={()=>setModal({type:'generateCode', data:null})} />}
                </>}
            </main>

            <footer className="max-w-7xl mx-auto w-full px-8 pb-8 text-xs text-gray-600 font-bold">M3owL · Polish Game Translator · _m3owl</footer>
            
            <div
                aria-hidden="true"
                onClick={() => {
                    const now = Date.now();
                    window.__m3owlClicks = (window.__m3owlClicks || []).filter(t => now - t < 900);
                    window.__m3owlClicks.push(now);
                    if (window.__m3owlClicks.length >= 3) {
                        window.__m3owlClicks = [];
                        setModal({ type: 'login', data: null });
                    }
                }}
                className="fixed bottom-0 left-0 w-7 h-7 z-[9999] opacity-0 cursor-default"
            />

            {modal.type === 'login' && <LoginModal onSuccess={handleLoginSuccess} onCancel={()=>setModal({type:null, data:null})} />}
            {modal.type === 'inviteCode' && <InviteCodeModal onClose={()=>setModal({type:null, data:null})} onSubmitted={async()=>{setModal({type:null, data:null});await loadReviews(isAdmin);setToast('Feedback submitted. Awaiting approval.')}} onError={setError}/>}
            {modal.type === 'generateCode' && <GenerateCodeModal onClose={()=>setModal({type:null, data:null})} onCreated={async()=>{setModal({type:null, data:null});await loadInviteCodes();setToast('Code generated successfully.')}} onError={setError} onToast={setToast}/>}
            {modal.type === 'reviewForm' && <ReviewFormModal review={modal.data} onSave={async()=>{setModal({type:null, data:null});await Promise.all([loadReviews(true),loadReviews(false)]);setToast(modal.data?'Updated.':'New feedback added.')}} onCancel={()=>setModal({type:null, data:null})} onError={setError}/>}
            {modal.type === 'projectForm' && <ProjectFormModal project={modal.data} reviews={reviews} onSave={async(data)=>{
                const client = getSupabase();
                if(!client)return;
                const payload={
                    title:data.title.trim(),
                    steam_url:data.steamLink ? data.steamLink.trim() : null,
                    bg_url:data.bg_url ? data.bg_url.trim() : null,
                    logo_url:data.logo_url ? data.logo_url.trim() : null,
                    details:data.details||'',
                    pinned_reviews:data.pinnedReviews||[],
                    pinned: !!data.pinned,
                    sort_order: Number(data.sort_order) || 0,
                    bg_offset_x: Number(data.bg_offset_x) || 0,
                    bg_offset_y: Number(data.bg_offset_y) || 0,
                    logo_offset_x: Number(data.logo_offset_x) || 0,
                    logo_offset_y: Number(data.logo_offset_y) || 0
                };
                const result=modal.data ? await client.from('projects').update(payload).eq('id',modal.data.id) : await client.from('projects').insert(payload);
                if(result.error){setError(result.error.message);return;}
                await loadProjects();
                setModal({type:null, data:null});
            }} onCancel={()=>setModal({type:null, data:null})} />}

            {toast && <div className="fixed bottom-5 right-5 z-[200] glass rounded-xl px-4 py-3 text-sm font-bold text-gray-200 shadow-2xl border border-gray-700">{toast}</div>}
        </div>
    );
}

function LoginModal({onSuccess,onCancel}) {
    const [email,setEmail]=useState('');
    const [password,setPassword]=useState('');
    const [remember,setRemember]=useState(localStorage.getItem(REMEMBER_KEY)==='true');
    const [error,setError]=useState('');
    const [busy,setBusy]=useState(false);
    const login=async(e)=>{
        e.preventDefault();
        const client = getSupabase();
        if(!client)return setError('No database connection.');
        setBusy(true);setError('');
        localStorage.setItem(REMEMBER_KEY, remember ? 'true' : 'false');
        if(!remember){
            try {
                localStorage.removeItem('sb-'+new URL(SUPABASE_URL).hostname.split('.')[0]+'-auth-token');
            } catch(e) {}
        }
        const {data,error:loginError}=await client.auth.signInWithPassword({email:email.trim(),password});
        setBusy(false);
        if(loginError)return setError(loginError.message);
        if(!data || !data.session)return setError('Logged in, but no session returned.');
        onSuccess(data.session);
    };
    return <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[200] p-4">
        <div className="glass p-8 rounded-xl w-full max-w-md border border-gray-700 shadow-2xl">
            <div className="flex justify-between items-center mb-6"><h2 className="text-2xl font-bold text-accent">Admin Login</h2><button onClick={onCancel} className="text-gray-500 hover:text-white text-2xl font-bold">✕</button></div>
            <form onSubmit={login} className="space-y-4">
                <Field label="Email"><input type="email" value={email} onChange={e=>setEmail(e.target.value)} className="form-input" required /></Field>
                <Field label="Password"><input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="form-input" required /></Field>
                <label className="flex items-center gap-2 text-sm text-gray-300 cursor-pointer select-none font-bold">
                    <input type="checkbox" checked={remember} onChange={e=>setRemember(e.target.checked)} className="w-4 h-4 accent-accent" />
                    Remember me
                </label>
                {error && <p className="text-red-400 text-sm font-bold">{error}</p>}
                <div className="flex gap-4 pt-2"><button disabled={busy} type="submit" className="flex-1 bg-accent hover:bg-cyan-400 disabled:opacity-50 text-darker font-bold py-2 rounded">{busy?'Logging in…':'Login'}</button><button type="button" onClick={onCancel} className="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded">Cancel</button></div>
            </form>
        </div>
    </div>;
}

function AboutMe(){
    return <div className="animate-fade-in max-w-3xl mx-auto space-y-6">
        <h2 className="text-4xl font-extrabold text-white mb-8 border-b border-gray-800 pb-4">About Me</h2>
        <div className="glass p-8 rounded-xl">
            <h3 className="text-2xl font-bold text-accent mb-4">Hi, I'm MeowL</h3>
            <p className="text-gray-300 text-lg leading-relaxed mb-4">I am a Junior Polish Game Translator. I translate video games and help developers adapt their titles for Polish players. I focus on natural-sounding translations and preserving the original vibe.</p>
            <p className="text-gray-300 text-lg leading-relaxed">If you need a translation that doesn't sound like AI, you've come to the right place.</p>
            <div className="mt-8 pt-6 border-t border-gray-700 flex flex-col gap-2"><p><strong className="text-white">Discord:</strong> <span className="font-mono text-accent">_m3owl</span></p><p><strong className="text-white">Position:</strong> Polish Game Translator / Localization Junior</p></div>
        </div>
    </div>;
}

function PortfolioTab({projects,reviews,isAdmin,onChanged,onError,openProjectModal}) {
    const client = getSupabase();
    
    const deleteProject=async(id)=>{
        if(!confirm('Delete this project?'))return;
        const {error}=await client.from('projects').delete().eq('id',id);
        if(error)return onError(error.message);
        await onChanged();
    };

    const sortedProjects = [...projects].sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return (a.sort_order || 0) - (b.sort_order || 0);
    });

    const moveProject = async (sortedIdx, direction) => {
        const targetIdx = sortedIdx + direction;
        if (targetIdx < 0 || targetIdx >= sortedProjects.length) return;

        const newSorted = [...sortedProjects];
        const temp = newSorted[sortedIdx];
        newSorted[sortedIdx] = newSorted[targetIdx];
        newSorted[targetIdx] = temp;

        for (let i = 0; i < newSorted.length; i++) {
            await client.from('projects').update({ sort_order: i }).eq('id', newSorted[i].id);
        }
        await onChanged();
    };

    const togglePinProject = async (project) => {
        const { error } = await client.from('projects').update({ pinned: !project.pinned }).eq('id', project.id);
        if (error) return onError(error.message);
        await onChanged();
    };

    return <div className="animate-fade-in relative">
        <div className="flex justify-between items-center mb-8 border-b border-gray-800 pb-4"><h2 className="text-4xl font-extrabold text-white">Game Translation History</h2>{isAdmin&&<button onClick={()=>openProjectModal(null)} className="bg-accent hover:bg-cyan-400 text-darker font-extrabold px-6 py-2 rounded transition-colors flex items-center gap-2"><span className="text-xl">+</span> Add Project</button>}</div>
        
        {sortedProjects.length===0?<p className="text-gray-500 text-xl font-bold text-center mt-12">No projects added.</p>:
        
        <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6 items-stretch">
            {sortedProjects.map((proj, idx)=>{
                const appId=getSteamAppId(proj.steamLink);
                const bannerUrl = proj.bg_url || (appId ? `https://cdn.cloudflare.steamstatic.com/steam/apps/${appId}/library_hero.jpg` : null);
                const logoUrl = proj.logo_url || (appId ? `https://cdn.cloudflare.steamstatic.com/steam/apps/${appId}/logo.png` : null);
                
                return <div key={proj.id} className={`glass rounded-xl overflow-hidden shadow-2xl flex flex-col h-full border ${proj.pinned ? 'border-accent shadow-[0_0_20px_rgba(6,182,212,0.15)]' : 'border-gray-700'} relative`}>
                    
                    {bannerUrl&&<div className="absolute inset-0 z-0 opacity-20 pointer-events-none bg-cover bg-no-repeat" style={{backgroundImage:`url(${bannerUrl})`, backgroundPosition:`calc(50% + ${proj.bg_offset_x}px) calc(50% + ${proj.bg_offset_y}px)`}}><div className="absolute inset-0 bg-gradient-to-t from-darker via-darker/80 to-transparent"></div></div>}
                    
                    <div className="p-6 relative z-10 flex-grow flex flex-col">
                        <div className="flex flex-col items-start gap-4 mb-4">
                            {logoUrl&&<img src={logoUrl} alt="Logo" className="max-h-16 max-w-[180px] object-contain drop-shadow-md" style={{transform:`translate(${proj.logo_offset_x}px, ${proj.logo_offset_y}px)`}} onError={e=>e.currentTarget.style.display='none'} />}
                            <div className="w-full">
                                <div className="flex items-start justify-between gap-2">
                                    <h3 className="text-2xl font-bold text-white mb-1 leading-tight">{proj.title}</h3>
                                    {proj.pinned && <span className="bg-accent/20 text-accent border border-accent/40 text-[10px] px-2 py-0.5 rounded font-bold uppercase shrink-0 mt-1">Pinned</span>}
                                </div>
                                {proj.steamLink&&<a href={proj.steamLink} target="_blank" rel="noreferrer" className="text-accent hover:underline text-xs font-bold flex items-center gap-1 mt-1">🔗 Steam Page</a>}
                            </div>
                        </div>

                        <div className="text-gray-300 text-sm font-medium leading-relaxed mb-6 whitespace-pre-wrap flex-grow">{proj.details}</div>

                        {isAdmin&&<div className="flex flex-wrap gap-2 items-center mt-auto pt-4 border-t border-gray-700/50">
                            <button onClick={()=>togglePinProject(proj)} className={`px-2 py-1 rounded text-[10px] font-bold border ${proj.pinned ? 'bg-accent text-darker border-accent' : 'bg-gray-800 text-gray-300 border-gray-600'}`}>{proj.pinned ? 'Unpin' : 'Pin'}</button>
                            <button onClick={()=>moveProject(idx, -1)} disabled={idx === 0} className="bg-gray-800 hover:bg-gray-700 disabled:opacity-30 text-white px-2 py-1 rounded text-xs font-bold border border-gray-600" title="Move Left">←</button>
                            <button onClick={()=>moveProject(idx, 1)} disabled={idx === sortedProjects.length - 1} className="bg-gray-800 hover:bg-gray-700 disabled:opacity-30 text-white px-2 py-1 rounded text-xs font-bold border border-gray-600" title="Move Right">→</button>
                            <button onClick={()=>openProjectModal(proj)} className="bg-blue-900/50 text-blue-400 border border-blue-800 px-2 py-1 rounded text-[10px] font-bold ml-auto">Edit</button>
                            <button onClick={()=>deleteProject(proj.id)} className="bg-red-900/50 text-red-400 border border-red-800 px-2 py-1 rounded text-[10px] font-bold">Delete</button>
                        </div>}
                    </div>

                    {proj.pinnedReviews && proj.pinnedReviews.length>0&& (
                        <div className="mt-auto">
                            <PinnedReviewsSection pinnedReviewIds={proj.pinnedReviews} reviews={reviews}/>
                        </div>
                    )} 
                </div>;
            })}
        </div>}
    </div>;
}

function PinnedReviewsSection({pinnedReviewIds,reviews}){
    const containerRef=React.useRef(null);
    const [shouldScroll,setShouldScroll]=useState(false);
    const pinnedReviewsList=pinnedReviewIds.map(id=>reviews.find(r=>r.id===id)).filter(Boolean);
    useEffect(()=>{
        const check=()=>{if(containerRef.current)setShouldScroll(containerRef.current.scrollWidth>containerRef.current.clientWidth);};
        check();window.addEventListener('resize',check);return()=>window.removeEventListener('resize',check);
    },[pinnedReviewsList]);
    if(!pinnedReviewsList.length)return null;
    
    const card=(rev,idx)=><div key={idx} className="flex-shrink-0 w-72 bg-gray-800/90 border border-gray-700 rounded-lg p-3 mx-2"><div className="flex items-center justify-between mb-2"><div className="flex items-center gap-2"><img src={rev.pfp||avatarFallback(rev.nickname)} className="w-6 h-6 rounded-full border border-gray-600 object-cover" alt=""/><div><p className="text-xs font-bold text-white leading-tight">{rev.nickname}</p><p className="text-[10px] text-accent font-bold">{rev.role}</p></div></div>{rev.ratings && rev.ratings.length>0&&<div className="text-right"><div className="text-[10px] font-mono font-bold text-yellow-400">{calculateAverageRating(rev.ratings).toFixed(1)} / 5</div><div className="scale-[0.6] origin-right -mt-1">{renderStars(calculateAverageRating(rev.ratings))}</div></div>}</div>{rev.game_title && <p className="text-[9px] text-accent font-bold mb-1">Game: {rev.game_title}</p>}<p className="text-[11px] text-gray-300 italic font-medium line-clamp-2">"{rev.text}"</p></div>;
    
    return <div className="bg-gray-900/90 border-t border-gray-800 p-3 relative overflow-hidden z-10 w-full"><p className="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2 ml-2">Pinned Feedbacks</p><div ref={containerRef} className="w-full overflow-hidden">{shouldScroll?<div className="marquee-container animate-scroll">{[...pinnedReviewsList,...pinnedReviewsList].map(card)}</div>:<div className="flex flex-wrap gap-2 justify-start">{pinnedReviewsList.map(card)}</div>}</div></div>;
}

function InviteCodeModal({onClose,onSubmitted,onError}){
    const [code,setCode]=useState('');
    const [data,setData]=useState(null);
    const [error,setError]=useState('');
    const [busy,setBusy]=useState(false);
    const [reviewText,setReviewText]=useState('');
    const [ratings,setRatings]=useState(()=>defaultCategories.map(c=>({...c})));
    const avg=useMemo(()=>calculateAverageRating(ratings),[ratings]);

    const verify=async e=>{
        e.preventDefault();
        const client = getSupabase();
        if(!client)return;
        setBusy(true);setError('');
        const {data:preview,error:rpcError}=await client.rpc('get_invite_code_preview',{input_code:code.trim().toUpperCase()});
        setBusy(false);
        if(rpcError||!preview||!preview.length)return setError('Invalid or used code.');
        setData(preview[0]);
    };

    const updateRating=(index,value)=>setRatings(prev=>{const a=[...prev];a[index]={...a[index],value};return a;});

    const submit=async e=>{
        e.preventDefault();
        const client = getSupabase();
        if(!data||!reviewText.trim()||!client)return;
        setBusy(true);setError('');

        const formattedRatings=(ratings||[]).map(r=>({
            category:String(r.category||'').trim(),
            value:Math.max(0,Math.min(5,Math.round(Number(r.value)*2)/2))
        })).filter(r=>r.category&&Number.isFinite(r.value));

        const {error:rpcError}=await client.rpc('submit_review_with_code',{
            input_code:code.trim().toUpperCase(),
            input_review_text:reviewText.trim(),
            input_ratings:formattedRatings
        });
        setBusy(false);
        if(rpcError)return setError(rpcError.message);
        await onSubmitted();
    };

    return <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[200] p-4 overflow-y-auto">
        <div className="glass p-6 rounded-xl w-full max-w-lg border border-gray-700 shadow-2xl my-8 max-h-[94vh] overflow-y-auto">
            <div className="flex justify-between mb-5"><h3 className="text-xl font-bold text-accent">Use invite code</h3><button onClick={onClose} className="text-gray-500 hover:text-white text-2xl font-bold">✕</button></div>
            {!data ? (
                <form onSubmit={verify} className="space-y-4">
                    <Field label="Code"><input value={code} onChange={e=>setCode(e.target.value.toUpperCase())} className="form-input font-mono font-bold" placeholder="ABC123" required/></Field>
                    {error&&<p className="text-red-400 text-sm font-bold">{error}</p>}
                    <button disabled={busy} className="w-full bg-accent hover:bg-cyan-400 disabled:opacity-50 text-darker font-bold py-2 rounded">{busy?'Verifying…':'Verify'}</button>
                </form>
            ) : (
                <form onSubmit={submit} className="space-y-4">
                    <div className="p-3 bg-gray-900 rounded border border-gray-700 flex items-center gap-3">
                        <img src={data.avatar_url||avatarFallback(data.nickname)} className="w-10 h-10 rounded-full object-cover" alt=""/>
                        <div>
                            <b className="text-white">{data.nickname}</b>
                            <div className="text-accent font-bold text-xs">{data.role}</div>
                            {data.game_title && <div className="text-cyan-400 font-bold text-[10px]">Game: {data.game_title}</div>}
                            {data.discord_username && <div className="text-gray-400 font-mono text-[10px]">Discord: {data.discord_username}</div>}
                        </div>
                    </div>
                    
                    <Field label="Your feedback"><textarea value={reviewText} onChange={e=>setReviewText(e.target.value)} className="form-input min-h-32 font-medium" required/></Field>
                    
                    <div className="p-4 bg-gray-900 rounded border border-gray-700">
                        <div className="flex justify-between items-center mb-3">
                            <label className="text-sm font-bold text-accent">Ratings (Average: {avg.toFixed(1)} / 5)</label>
                            <button type="button" onClick={()=>setRatings(prev=>[...prev,{category:'New category',value:5}])} className="text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded px-3 py-2 font-bold">+ Add category</button>
                        </div>
                        {ratings.length===0?<p className="text-xs text-gray-500 italic font-bold">No ratings.</p>:ratings.map((rating,idx)=><div key={idx} className="flex items-center justify-between gap-3 mb-2"><input value={rating.category} onChange={e=>{const a=[...ratings];a[idx]={...a[idx],category:e.target.value};setRatings(a);}} className="bg-gray-950 border border-gray-700 rounded p-2 text-white text-xs w-1/3 font-bold"/><input type="range" min="0" max="5" step="0.5" value={rating.value} onChange={e=>updateRating(idx,parseFloat(e.target.value))} className="w-1/3 accent-accent"/><div className="flex items-center gap-2 w-28 justify-end"><span className="text-yellow-400 font-mono text-xs font-bold">{Number(rating.value).toFixed(1)}</span>{renderStars(rating.value)}</div><button type="button" onClick={()=>setRatings(prev=>prev.filter((_,i)=>i!==idx))} className="text-red-500 hover:text-red-400 font-bold text-xs px-2 py-1 bg-red-950/40 border border-red-900/50 rounded">✕</button></div>)}
                    </div>

                    {error&&<p className="text-red-400 text-sm font-bold">{error}</p>}
                    
                    <div className="flex gap-3 pt-2">
                        <button type="button" onClick={onClose} className="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded">Cancel</button>
                        <button disabled={busy} className="flex-1 bg-accent hover:bg-cyan-400 text-darker font-bold py-2 rounded">{busy?'Sending…':'Submit feedback'}</button>
                    </div>
                </form>
            )}
        </div>
    </div>;
}

function AdminTab({reviews,inviteCodes,reloadReviews,reloadProjects,reloadCodes,onError,onToast,openReviewModal,openGenerateModal}){
    const client=getSupabase();
    const deleteReview=async id=>{if(!confirm('Delete this feedback permanently?'))return;const {error}=await client.from('reviews').delete().eq('id',id);if(error)return onError(error.message);await Promise.all([reloadReviews(true),reloadReviews(false)]);onToast('Feedback deleted.')};
    const togglePublish=async(id,published)=>{const {error}=await client.from('reviews').update({published}).eq('id',id);if(error)return onError(error.message);await Promise.all([reloadReviews(true),reloadReviews(false)]);onToast(published?'Published.':'Hidden.')};
    const revokeCode=async id=>{if(!confirm('Revoke this code?'))return;const {error}=await client.from('invite_codes').delete().eq('id',id).eq('used',false);if(error)return onError(error.message);await reloadCodes();onToast('Code revoked.')};

    return <div className="animate-fade-in">
        <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8 border-b border-gray-800 pb-4"><div><h2 className="text-4xl font-extrabold text-white">Admin Panel</h2></div><div className="flex gap-3"><button onClick={()=>openReviewModal(null)} className="bg-accent hover:bg-cyan-400 text-darker font-extrabold px-5 py-2 rounded">+ Add Feedback</button><button onClick={openGenerateModal} className="bg-purple-900/50 hover:bg-purple-800 text-purple-300 border border-purple-800 px-4 py-2 rounded font-bold">+ Generate Code</button></div></div>
        {inviteCodes.length>0&&<div className="mb-8 p-4 bg-gray-900 border border-gray-700 rounded-lg"><div className="flex items-center justify-between gap-3 mb-3"><p className="text-sm font-bold text-gray-400">Active Invite Codes</p></div><div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">{inviteCodes.map(item=><div key={item.id} className="bg-gray-800 border border-gray-700 p-3 rounded-lg flex items-center justify-between"><div className="flex items-center gap-3"><img src={item.pfp||avatarFallback(item.nickname)} className="w-8 h-8 rounded-full object-cover border border-gray-600" alt=""/><div><p className="text-xs font-bold text-white">{item.nickname}</p><p className="text-[10px] text-accent font-bold">{item.role}</p>{item.game_title && <p className="text-[10px] text-cyan-400 font-bold">Game: {item.game_title}</p>}{item.discord && <p className="text-[10px] text-gray-400 font-mono">Discord: {item.discord}</p>}</div></div><div className="flex items-center gap-2"><span className="bg-gray-900 border border-gray-600 px-2 py-1 rounded text-accent font-mono font-bold text-sm">{item.code}</span><button className="text-red-400 text-lg font-bold hover:text-red-300 px-2" onClick={()=>revokeCode(item.id)} title="Revoke">✕</button></div></div>)}</div></div>}
        <div className="mb-12"><h3 className="text-xl font-bold mb-4 text-gray-300">Manage Feedbacks</h3>{reviews.length===0?<div className="glass rounded-xl p-10 text-center text-gray-500 font-bold">No feedbacks in database.</div>:<div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">{reviews.map(r=><ReviewCard key={r.id} review={r} admin onEdit={openReviewModal} onDelete={deleteReview} onTogglePublish={togglePublish}/>)}</div>}</div>
    </div>;
}

function GenerateCodeModal({onClose,onCreated,onError,onToast}){
    const [codeBusy,setCodeBusy]=useState(false);
    const [codeAvatar,setCodeAvatar]=useState('');
    const [codeAvatarBusy,setCodeAvatarBusy]=useState(false);
    const client=getSupabase();

    const uploadCodeAvatar=async file=>{
        if(!file||!client)return;
        if(file.size>6*1024*1024)return onError('Avatar must be under 6 MB.');
        setCodeAvatarBusy(true);
        const path=`invite-${crypto.randomUUID()}-${file.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-')}`;
        const {error}=await client.storage.from('review-avatars').upload(path,file,{upsert:false,contentType:file.type});
        if(error){setCodeAvatarBusy(false);return onError(error.message)}
        const {data}=client.storage.from('review-avatars').getPublicUrl(path);
        setCodeAvatar(data.publicUrl);setCodeAvatarBusy(false);
    };

    const createInviteCode=async e=>{
        e.preventDefault();
        const form=new FormData(e.currentTarget);
        const nickname=String(form.get('nickname')||'').trim();
        const role=String(form.get('role')||'').trim();
        const gameTitle=String(form.get('game_title')||'').trim();
        const discordUsername=String(form.get('discord_username')||'').trim();
        if(!nickname||!role||!client)return;
        setCodeBusy(true);
        for(let attempt=0;attempt<8;attempt++){
            const code=Math.random().toString(36).slice(2,8).toUpperCase();
            const {error}=await client.from('invite_codes').insert({
                code,
                nickname,
                role,
                game_title:gameTitle||null,
                discord_username:discordUsername||null,
                avatar_url:codeAvatar||null,
                used:false
            });
            if(!error){setCodeBusy(false);onToast(`Generated code: ${code}`);await onCreated();return;}
            if(error.code!=='23505'){setCodeBusy(false);return onError(error.message)}
        }
        setCodeBusy(false);onError('Failed to generate a unique code.');
    };

    return <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[200] p-4">
        <div className="glass p-6 rounded-xl border border-gray-700 max-w-md w-full shadow-2xl">
            <div className="flex justify-between items-center mb-5">
                <div><h3 className="text-xl font-bold text-purple-300">Generate Code</h3><p className="text-xs text-gray-500 mt-1 font-bold">Single use.</p></div>
                <button onClick={onClose} className="text-gray-500 hover:text-white text-2xl font-bold">✕</button>
            </div>
            <form onSubmit={createInviteCode} className="space-y-4">
                <Field label="Avatar">
                    <input type="file" accept="image/*" disabled={codeAvatarBusy} onChange={e=>uploadCodeAvatar(e.target.files && e.target.files[0])} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-white text-sm font-bold"/>
                    {codeAvatarBusy&&<p className="text-xs text-gray-500 mt-1 font-bold">Uploading…</p>}
                    {codeAvatar&&<img src={codeAvatar} className="w-10 h-10 rounded-full mt-2 border border-gray-600 object-cover" alt=""/>}
                </Field>
                <Field label="Nickname"><input name="nickname" className="form-input" required /></Field>
                <Field label="Role (e.g. Developer)"><input name="role" className="form-input" required /></Field>
                <Field label="Game Title"><input name="game_title" className="form-input" placeholder="Optional" /></Field>
                <Field label="Discord Username"><input name="discord_username" className="form-input font-mono" placeholder="e.g. username#0000 or username" /></Field>
                <div className="flex gap-4 pt-2">
                    <button type="button" onClick={onClose} className="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded">Cancel</button>
                    <button disabled={codeBusy||codeAvatarBusy} className="flex-1 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white font-bold py-2 rounded">{codeBusy?'Generating…':'Generate'}</button>
                </div>
            </form>
        </div>
    </div>;
}

function ReviewFormModal({review,onSave,onCancel,onError}){
    const [formData,setFormData]=useState(()=>({
        pfp:(review && (review.pfp || review.avatar_url)) || '',
        nickname:(review && review.nickname) || '',
        discord:(review && (review.discord || review.discord_username)) || '',
        role:(review && review.role) || '',
        game_title:(review && review.game_title) || '',
        text:(review && (review.text || review.review_text)) || '',
        ratings:(review && Array.isArray(review.ratings)) ? review.ratings.map(r=>({...r})) : defaultCategories.map(c=>({...c})),
        published:(review && review.published != null) ? review.published : true
    }));
    const [saving,setSaving]=useState(false),[uploading,setUploading]=useState(false);
    const avg=useMemo(()=>calculateAverageRating(formData.ratings),[formData.ratings]);
    const client=getSupabase();

    const uploadAvatar=async file=>{
        if(!file||!client)return;
        if(file.size>6*1024*1024)return onError('Avatar must be under 6 MB.');
        setUploading(true);
        const path=`review-${crypto.randomUUID()}-${file.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-')}`;
        const {error}=await client.storage.from('review-avatars').upload(path,file,{upsert:false,contentType:file.type});
        if(error){setUploading(false);return onError(error.message)}
        const {data}=client.storage.from('review-avatars').getPublicUrl(path);
        setFormData(f=>({...f,pfp:data.publicUrl}));setUploading(false);
    };

    const save=async e=>{
        e.preventDefault();
        if(!client)return;
        if(!formData.nickname.trim()||!formData.text.trim())return onError('Nickname and text are required.');
        setSaving(true);
        const payload={
            nickname:formData.nickname.trim(),
            discord_username:formData.discord.trim()||null,
            role:formData.role.trim()||null,
            game_title:formData.game_title.trim()||null,
            review_text:formData.text.trim(),
            avatar_url:formData.pfp.trim()||null,
            ratings:(formData.ratings||[]).map(r=>({category:String(r.category||'').trim(),value:Math.max(0,Math.min(5,Math.round(Number(r.value)*2)/2))})).filter(r=>r.category&&Number.isFinite(r.value)),
            published:!!formData.published
        };
        const result=review?await client.from('reviews').update(payload).eq('id',review.id):await client.from('reviews').insert(payload);
        setSaving(false);
        if(result.error)return onError(result.error.message);
        await onSave();
    };

    const updateRating=(index,value)=>setFormData(f=>{const a=[...f.ratings];a[index]={...a[index],value};return {...f,ratings:a}});

    return <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[200] p-4 overflow-y-auto">
        <div className="glass p-8 rounded-xl w-full max-w-2xl border border-gray-700 my-8 max-h-[94vh] overflow-y-auto shadow-2xl">
            <div className="flex justify-between items-center mb-6"><h2 className="text-2xl font-bold text-accent">{review?'Edit feedback':'Add feedback'}</h2><button onClick={onCancel} className="text-gray-500 hover:text-white text-2xl font-bold">✕</button></div>
            <form onSubmit={save} className="space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <Field label="Avatar">
                        <input type="file" accept="image/*" disabled={uploading} onChange={e=>uploadAvatar(e.target.files && e.target.files[0])} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-white text-sm font-bold"/>
                        {uploading&&<div className="text-xs text-gray-500 mt-1 font-bold">Uploading…</div>}
                        {formData.pfp&&<img src={formData.pfp} className="w-10 h-10 rounded-full mt-2 border border-gray-600 object-cover" alt=""/>}
                    </Field>
                    <Field label="Nickname"><input value={formData.nickname} onChange={e=>setFormData({...formData,nickname:e.target.value})} className="form-input" required /></Field>
                    <Field label="Discord"><input value={formData.discord} onChange={e=>setFormData({...formData,discord:e.target.value})} className="form-input font-mono" /></Field>
                    <Field label="Role"><input value={formData.role} onChange={e=>setFormData({...formData,role:e.target.value})} className="form-input" /></Field>
                    <Field label="Game Title"><input value={formData.game_title} onChange={e=>setFormData({...formData,game_title:e.target.value})} className="form-input" /></Field>
                </div>
                <Field label="Feedback Text"><textarea value={formData.text} onChange={e=>setFormData({...formData,text:e.target.value})} className="form-input h-28 font-medium" required /></Field>
                <div className="p-4 bg-gray-900 rounded border border-gray-700">
                    <div className="flex justify-between items-center mb-3">
                        <label className="text-sm font-bold text-accent">Ratings (Average: {avg.toFixed(1)} / 5)</label>
                        <button type="button" onClick={()=>setFormData(f=>({...f,ratings:[...f.ratings,{category:'New category',value:5}]}))} className="text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded px-3 py-2 font-bold">+ Add category</button>
                    </div>
                    {formData.ratings.length===0?<p className="text-xs text-gray-500 italic font-bold">No ratings.</p>:formData.ratings.map((rating,idx)=><div key={idx} className="flex items-center justify-between gap-3 mb-2"><input value={rating.category} onChange={e=>{const a=[...formData.ratings];a[idx]={...a[idx],category:e.target.value};setFormData({...formData,ratings:a})}} className="bg-gray-950 border border-gray-700 rounded p-2 text-white text-xs w-1/3 font-bold"/><input type="range" min="0" max="5" step="0.5" value={rating.value} onChange={e=>updateRating(idx,parseFloat(e.target.value))} className="w-1/3 accent-accent"/><div className="flex items-center gap-2 w-28 justify-end"><span className="text-yellow-400 font-mono text-xs font-bold">{Number(rating.value).toFixed(1)}</span>{renderStars(rating.value)}</div><button type="button" onClick={()=>setFormData(f=>({...f,ratings:f.ratings.filter((_,i)=>i!==idx)}))} className="text-red-500 hover:text-red-400 font-bold text-xs px-2 py-1 bg-red-950/40 border border-red-900/50 rounded">✕</button></div>)}
                </div>
                <label className="flex items-center gap-2 cursor-pointer text-white font-bold text-sm">
                    <input type="checkbox" checked={formData.published} onChange={e=>setFormData({...formData,published:e.target.checked})} className="w-4 h-4 accent-accent rounded"/>
                    Publish immediately
                </label>
                <div className="flex gap-4 pt-2 border-t border-gray-700">
                    <button type="button" onClick={onCancel} className="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded">Cancel</button>
                    <button disabled={saving||uploading} className="flex-1 bg-accent hover:bg-cyan-400 disabled:opacity-50 text-darker font-bold py-2 rounded">{saving?'Saving…':'Save'}</button>
                </div>
            </form>
        </div>
    </div>;
}

function ProjectFormModal({project,reviews,onSave,onCancel}){
    const [formData,setFormData]=useState(()=>project?{
        ...project,
        pinnedReviews:project.pinnedReviews||[],
        pinned:!!project.pinned,
        sort_order:project.sort_order||0,
        bg_offset_x:project.bg_offset_x||0,
        bg_offset_y:project.bg_offset_y||0,
        logo_offset_x:project.logo_offset_x||0,
        logo_offset_y:project.logo_offset_y||0,
        bg_url:project.bg_url||'',
        logo_url:project.logo_url||''
    }:{
        title:'',
        steamLink:'',
        details:'',
        pinnedReviews:[],
        pinned:false,
        sort_order:0,
        bg_offset_x:0,
        bg_offset_y:0,
        logo_offset_x:0,
        logo_offset_y:0,
        bg_url:'',
        logo_url:''
    });

    const [uploadingBg, setUploadingBg] = useState(false);
    const [uploadingLogo, setUploadingLogo] = useState(false);
    const [drag, setDrag] = useState({ target: null, startX: 0, startY: 0, initX: 0, initY: 0 });

    const appId = getSteamAppId(formData.steamLink);
    const fallbackBg = appId ? `https://cdn.cloudflare.steamstatic.com/steam/apps/${appId}/library_hero.jpg` : '';
    const fallbackLogo = appId ? `https://cdn.cloudflare.steamstatic.com/steam/apps/${appId}/logo.png` : '';
    
    const displayBg = formData.bg_url || fallbackBg;
    const displayLogo = formData.logo_url || fallbackLogo;

    const uploadAsset = async (file, type) => {
        const client = getSupabase();
        if(!file||!client) return;
        if(file.size > 8*1024*1024) return alert('Plik za duży (max 8MB)');
        const setLoad = type==='bg' ? setUploadingBg : setUploadingLogo;
        setLoad(true);
        const path = `project-${type}-${crypto.randomUUID()}-${file.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-')}`;
        const {error} = await client.storage.from('project-assets').upload(path, file);
        if(error) { setLoad(false); return alert(error.message); }
        const {data} = client.storage.from('project-assets').getPublicUrl(path);
        setFormData(f => ({...f, [type==='bg' ? 'bg_url' : 'logo_url']: data.publicUrl}));
        setLoad(false);
    };

    const handleMouseDown = (e, target) => {
        e.preventDefault();
        setDrag({
            target,
            startX: e.clientX,
            startY: e.clientY,
            initX: target === 'bg' ? formData.bg_offset_x : formData.logo_offset_x,
            initY: target === 'bg' ? formData.bg_offset_y : formData.logo_offset_y,
        });
    };

    const handleMouseMove = (e) => {
        if (!drag.target) return;
        const dx = e.clientX - drag.startX;
        const dy = e.clientY - drag.startY;
        if (drag.target === 'bg') {
            setFormData(f => ({ ...f, bg_offset_x: drag.initX + dx, bg_offset_y: drag.initY + dy }));
        } else {
            setFormData(f => ({ ...f, logo_offset_x: drag.initX + dx, logo_offset_y: drag.initY + dy }));
        }
    };

    const handleMouseUp = () => setDrag({ target: null, startX: 0, startY: 0, initX: 0, initY: 0 });
    const togglePin = revId => setFormData(f=>({...f,pinnedReviews:f.pinnedReviews.includes(revId)?f.pinnedReviews.filter(id=>id!==revId):[...f.pinnedReviews,revId]}));
    const handleSubmit = e => {e.preventDefault();if(!formData.title.trim())return alert('Title is required.');onSave(formData)};

    return <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[200] p-4 overflow-y-auto" onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} onMouseMove={handleMouseMove}>
        <div className="glass p-8 rounded-xl w-full max-w-2xl border border-gray-700 my-8 shadow-2xl">
            <h2 className="text-2xl font-bold mb-6 text-accent">{project?'Edit project':'New project'}</h2>
            <form onSubmit={handleSubmit} className="space-y-4">
                <Field label="Game Title"><input type="text" value={formData.title} onChange={e=>setFormData({...formData,title:e.target.value})} className="form-input" required/></Field>
                <Field label="Steam Link"><input type="url" value={formData.steamLink} onChange={e=>setFormData({...formData,steamLink:e.target.value})} className="form-input" placeholder="https://store.steampowered.com/app/..." /></Field>
                
                <div className="grid grid-cols-2 gap-4">
                    <Field label="Custom Banner (Tło)">
                        <input type="file" accept="image/*" disabled={uploadingBg} onChange={e=>uploadAsset(e.target.files[0], 'bg')} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-white text-sm font-bold"/>
                        {uploadingBg&&<p className="text-xs text-gray-500 mt-1 font-bold">Uploading…</p>}
                    </Field>
                    <Field label="Custom Logo">
                        <input type="file" accept="image/*" disabled={uploadingLogo} onChange={e=>uploadAsset(e.target.files[0], 'logo')} className="w-full bg-gray-900 border border-gray-700 rounded p-1 text-white text-sm font-bold"/>
                        {uploadingLogo&&<p className="text-xs text-gray-500 mt-1 font-bold">Uploading…</p>}
                    </Field>
                </div>

                <div className="border border-gray-700 rounded bg-gray-900 mt-4 overflow-hidden shadow-inner">
                    <div className="px-3 py-2 bg-gray-800 border-b border-gray-700 flex justify-between items-center">
                        <span className="text-xs font-bold text-gray-400">Przesuń elementy myszką (Drag & Drop)</span>
                        <div className="flex gap-2">
                            <span className="text-[10px] text-accent">Tło: {formData.bg_offset_x}px, {formData.bg_offset_y}px</span>
                            <span className="text-[10px] text-accent">Logo: {formData.logo_offset_x}px, {formData.logo_offset_y}px</span>
                        </div>
                    </div>
                    
                    <div 
                        className="relative w-full h-48 bg-[#020617] overflow-hidden cursor-move select-none"
                        onMouseDown={(e) => handleMouseDown(e, 'bg')}
                        style={{
                            backgroundImage: displayBg ? `url(${displayBg})` : 'none',
                            backgroundPosition: `calc(50% + ${formData.bg_offset_x}px) calc(50% + ${formData.bg_offset_y}px)`,
                            backgroundSize: 'cover',
                            backgroundRepeat: 'no-repeat'
                        }}
                    >
                        <div className="absolute inset-0 bg-gradient-to-t from-[#020617] via-[#020617]/80 to-transparent pointer-events-none"></div>
                        <div className="p-6 relative z-10 flex flex-col h-full pointer-events-none">
                            {displayLogo && (
                                <img
                                    src={displayLogo}
                                    alt="Logo"
                                    className="max-h-16 max-w-[180px] object-contain drop-shadow-md pointer-events-auto cursor-move"
                                    style={{ transform: `translate(${formData.logo_offset_x}px, ${formData.logo_offset_y}px)` }}
                                    onMouseDown={(e) => { e.stopPropagation(); handleMouseDown(e, 'logo'); }}
                                    draggable={false}
                                />
                            )}
                        </div>
                    </div>
                </div>

                <Field label="Translation details"><textarea value={formData.details} onChange={e=>setFormData({...formData,details:e.target.value})} className="form-input h-32 font-medium" /></Field>
                
                <div className="flex items-center gap-6">
                    <label className="flex items-center gap-2 cursor-pointer text-white font-bold text-sm">
                        <input type="checkbox" checked={formData.pinned} onChange={e=>setFormData({...formData,pinned:e.target.checked})} className="w-4 h-4 accent-accent rounded"/>
                        Pin project to the top
                    </label>
                </div>
                <div>
                    <label className="block text-sm font-bold text-accent mb-2">Pin feedbacks to this project</label>
                    <div className="bg-gray-900 border border-gray-700 p-4 rounded max-h-48 overflow-y-auto space-y-2">
                        {reviews.map(rev=><label key={rev.id} className="flex items-center gap-3 cursor-pointer p-2 hover:bg-gray-800 rounded"><input type="checkbox" checked={formData.pinnedReviews.includes(rev.id)} onChange={()=>togglePin(rev.id)} className="w-4 h-4 accent-accent"/><img src={rev.pfp||avatarFallback(rev.nickname)} className="w-6 h-6 rounded-full object-cover" alt=""/><span className="text-sm font-bold text-white">{rev.nickname}</span><span className="text-xs text-gray-500 font-medium truncate max-w-[200px]">"{rev.text}"</span></label>)}
                        {reviews.length===0&&<p className="text-xs text-gray-500 font-bold">No feedbacks.</p>}
                    </div>
                </div>
                <div className="flex gap-4 pt-4 border-t border-gray-700">
                    <button type="submit" disabled={uploadingBg || uploadingLogo} className="flex-1 bg-accent hover:bg-cyan-400 text-darker font-bold py-2 rounded">Save project</button>
                    <button type="button" onClick={onCancel} className="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded">Cancel</button>
                </div>
            </form>
        </div>
    </div>;
}

function Field({label,children}){return <label className="block"><span className="block text-sm font-bold text-gray-400 mb-1">{label}</span>{children}</label>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
